<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>mauk ∩ abaci</title>
  <style>
    :root {
      --bg:         #09090f;
      --surface:    #111120;
      --border:     #1e1e38;
      --a-color:    #e8b86d;   /* MAUK — warm amber */
      --b-color:    #6db8e8;   /* ABACI   — cool cyan  */
      --u-color:    #b86de8;   /* user    — violet     */
      --dim:        #4a4a70;
      --text:       #d0d0f0;
      --text-muted: #6060a0;
      --radius:     8px;
      --font-mono:  "JetBrains Mono", "Fira Code", "Courier New", monospace;
      --font-sans:  "Inter", system-ui, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 13px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ────────────────────────────────────────────────────────────── */

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }

    header h1 {
      font-family: var(--font-mono);
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 0.1em;
      color: var(--text-muted);
    }

    header h1 span.a { color: var(--a-color); }
    header h1 span.b { color: var(--b-color); }

    .status-row {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .status-pill {
      font-family: var(--font-mono);
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 99px;
      background: #1a1a30;
      border: 1px solid var(--border);
    }
    .status-pill.ready    { border-color: #3a6a3a; color: #6fe06f; }
    .status-pill.loading  { border-color: #6a5a2a; color: var(--a-color); }
    .status-pill.demo     { border-color: #3a3a6a; color: var(--text-muted); }
    .status-pill.error    { border-color: #6a2a2a; color: #e06f6f; }
    .status-pill.unloaded { border-color: var(--border); color: var(--dim); }

    .device-tag {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-muted);
    }

    /* ── Main layout: 3 columns ──────────────────────────────────────────── */

    main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    .sidebar {
      width: 220px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border);
      background: var(--surface);
      overflow: hidden;
    }

    .sidebar.right {
      border-right: none;
      border-left: 1px solid var(--border);
    }

    .sidebar-header {
      padding: 10px 12px 8px;
      border-bottom: 1px solid var(--border);
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.08em;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .sidebar-header .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .sidebar-a .dot { background: var(--a-color); }
    .sidebar-b .dot { background: var(--b-color); }
    .sidebar-shared .dot { background: var(--dim); }

    .sidebar-section {
      padding: 8px 12px 4px;
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    /* Memory obsessions */
    .obsessions {
      padding: 4px 12px 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      flex-shrink: 0;
    }

    .obsession-tag {
      font-family: var(--font-mono);
      font-size: 9px;
      padding: 1px 6px;
      border-radius: 99px;
      background: #1a1a30;
      border: 1px solid var(--border);
      color: var(--dim);
    }

    .sidebar-a .obsession-tag { border-color: #3a2e10; color: var(--a-color); opacity: 0.7; }
    .sidebar-b .obsession-tag { border-color: #102838; color: var(--b-color); opacity: 0.7; }

    /* File list */
    .file-list {
      flex: 1;
      overflow-y: auto;
      padding: 4px 0;
    }

    .file-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 5px 12px;
      cursor: pointer;
      gap: 6px;
    }

    .file-item:hover { background: rgba(255,255,255,0.03); }

    .file-item .file-name {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text);
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .file-item .file-del {
      font-size: 10px;
      color: var(--dim);
      cursor: pointer;
      padding: 1px 4px;
      border-radius: 3px;
      opacity: 0;
      transition: opacity 0.15s;
      background: none;
      border: none;
    }

    .file-item:hover .file-del { opacity: 1; }
    .file-item .file-del:hover { color: #e06f6f; }

    /* File add row */
    .file-add {
      padding: 6px 12px 8px;
      display: flex;
      gap: 4px;
      flex-shrink: 0;
    }

    .file-add input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 3px 6px;
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text);
      outline: none;
    }

    .file-add input:focus { border-color: var(--dim); }

    .btn-tiny {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 3px 7px;
      font-size: 10px;
      color: var(--text-muted);
      cursor: pointer;
      white-space: nowrap;
    }

    .btn-tiny:hover { background: #1a1a30; color: var(--text); }

    /* ── Center: conversation ─────────────────────────────────────────────── */

    .center {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .conversation {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }

    .msg {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-width: 680px;
    }

    .msg.bot-a { align-self: flex-start; }
    .msg.bot-b { align-self: flex-end; }
    .msg.user  { align-self: center; }

    .msg-meta {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .msg.bot-b .msg-meta { flex-direction: row-reverse; }
    .msg.user .msg-meta  { justify-content: center; }

    .speaker-name {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.08em;
    }

    .msg.bot-a .speaker-name { color: var(--a-color); }
    .msg.bot-b .speaker-name { color: var(--b-color); }
    .msg.user  .speaker-name { color: var(--u-color); }

    .msg-time {
      font-family: var(--font-mono);
      font-size: 9px;
      color: var(--dim);
    }

    .msg-bubble {
      padding: 10px 14px;
      border-radius: var(--radius);
      font-size: 13px;
      line-height: 1.65;
      border: 1px solid transparent;
      white-space: pre-wrap;
    }

    .msg.bot-a .msg-bubble {
      background: #16120a;
      border-color: #2a2010;
      color: #e0d4b8;
    }

    .msg.bot-b .msg-bubble {
      background: #0a1016;
      border-color: #102030;
      color: #b8d4e0;
    }

    .msg.user .msg-bubble {
      background: #130a16;
      border-color: #281040;
      color: #d4b8e0;
      font-style: italic;
    }

    /* Empty state */
    .empty-state {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 10px;
      color: var(--dim);
    }

    .empty-state .glyph {
      font-size: 32px;
      opacity: 0.3;
    }

    .empty-state p {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.06em;
    }

    /* ── Input area ──────────────────────────────────────────────────────── */

    .input-area {
      border-top: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }

    .controls {
      display: flex;
      gap: 6px;
      padding: 8px 12px 0;
      align-items: center;
    }

    .btn-generate {
      padding: 5px 14px;
      border-radius: var(--radius);
      border: 1px solid;
      font-family: var(--font-mono);
      font-size: 11px;
      cursor: pointer;
      letter-spacing: 0.04em;
      transition: all 0.15s;
    }

    .btn-generate.a {
      background: #16120a;
      border-color: #3a2e10;
      color: var(--a-color);
    }

    .btn-generate.a:hover:not(:disabled) {
      background: #2a2010;
      border-color: var(--a-color);
    }

    .btn-generate.b {
      background: #0a1016;
      border-color: #102838;
      color: var(--b-color);
    }

    .btn-generate.b:hover:not(:disabled) {
      background: #102030;
      border-color: var(--b-color);
    }

    .btn-generate:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn-auto {
      padding: 5px 12px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 11px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-auto.active {
      border-color: #3a6a3a;
      color: #6fe06f;
      background: #0a160a;
    }

    .btn-auto:hover { background: #1a1a30; }

    .spacer { flex: 1; }

    .btn-clear {
      padding: 5px 10px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: none;
      color: var(--dim);
      font-size: 11px;
      cursor: pointer;
    }

    .btn-clear:hover { border-color: #6a2a2a; color: #e06f6f; }

    .user-input-row {
      display: flex;
      gap: 6px;
      padding: 8px 12px 10px;
      align-items: flex-end;
    }

    .user-input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px 12px;
      font-family: var(--font-sans);
      font-size: 13px;
      color: var(--text);
      outline: none;
      resize: none;
      line-height: 1.5;
      min-height: 36px;
      max-height: 100px;
    }

    .user-input:focus {
      border-color: #281040;
      background: #0d0a10;
    }

    .btn-send {
      padding: 8px 14px;
      border-radius: var(--radius);
      border: 1px solid #281040;
      background: #130a16;
      color: var(--u-color);
      font-family: var(--font-mono);
      font-size: 11px;
      cursor: pointer;
      white-space: nowrap;
      align-self: flex-end;
    }

    .btn-send:hover { background: #1e1028; border-color: var(--u-color); }

    /* ── File viewer modal ───────────────────────────────────────────────── */

    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }

    .modal-backdrop.open { display: flex; }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      width: min(600px, 90vw);
      max-height: 70vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
    }

    .modal-header span {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-muted);
    }

    .modal-close {
      background: none;
      border: none;
      color: var(--dim);
      font-size: 16px;
      cursor: pointer;
      padding: 0 4px;
    }

    .modal-close:hover { color: var(--text); }

    .modal-body {
      flex: 1;
      overflow-y: auto;
    }

    .modal-body textarea {
      width: 100%;
      height: 100%;
      min-height: 300px;
      background: var(--bg);
      color: var(--text);
      border: none;
      padding: 14px;
      font-family: var(--font-mono);
      font-size: 11px;
      line-height: 1.6;
      resize: none;
      outline: none;
    }

    .modal-footer {
      display: flex;
      gap: 6px;
      justify-content: flex-end;
      padding: 8px 14px;
      border-top: 1px solid var(--border);
    }

    /* ── Scrollbar ───────────────────────────────────────────────────────── */

    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* ── Spinner ─────────────────────────────────────────────────────────── */

    .spinner {
      display: inline-block;
      width: 10px; height: 10px;
      border: 1.5px solid var(--border);
      border-top-color: var(--text-muted);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-left: 4px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* shared sidebar uses neutral colors */
    .sidebar-shared .file-name { color: var(--text-muted); }

  </style>
</head>
<body>

<!-- ── Header ──────────────────────────────────────────────────────────────── -->
<header>
  <h1>
    <span class="a" id="nameA">MAUK</span>
    <span style="color:var(--dim)"> ∩ </span>
    <span class="b" id="nameB">ABACI</span>
  </h1>

  <div class="status-row">
    <span class="status-pill unloaded" id="statusA">A: —</span>
    <span class="status-pill unloaded" id="statusB">B: —</span>
    <span class="device-tag" id="deviceTag"></span>
  </div>
</header>

<!-- ── Main ────────────────────────────────────────────────────────────────── -->
<main>

  <!-- Bot A sidebar -->
  <div class="sidebar sidebar-a" id="sidebarA">
    <div class="sidebar-header">
      <div class="dot"></div>
      <span id="labelA">MAUK</span>
    </div>

    <div class="sidebar-section">memory</div>
    <div class="obsessions" id="obsessionsA">
      <span class="obsession-tag" style="opacity:0.3">—</span>
    </div>

    <div class="sidebar-section">private files</div>
    <div class="file-list" id="filesA"></div>
    <div class="file-add">
      <input id="newFileA" placeholder="new file…" />
      <button class="btn-tiny" onclick="createFile('bot_a')">+</button>
    </div>
  </div>

  <!-- Center: conversation -->
  <div class="center">
    <div class="conversation" id="conversation">
      <div class="empty-state" id="emptyState">
        <div class="glyph">∅</div>
        <p>the empty set is waiting</p>
      </div>
    </div>

    <!-- Input controls -->
    <div class="input-area">
      <div class="controls">
        <button class="btn-generate a" id="btnA" onclick="generate('a')">
          ↓ generate MAUK
        </button>
        <button class="btn-generate b" id="btnB" onclick="generate('b')">
          ↓ generate ABACI
        </button>
        <button class="btn-auto" id="btnAuto" onclick="toggleAuto()">
          AUTO
        </button>
        <div class="spacer"></div>
        <button class="btn-clear" onclick="clearConversation()">clear</button>
      </div>
      <div class="user-input-row">
        <textarea
          class="user-input"
          id="userInput"
          rows="1"
          placeholder="join the conversation…"
          onkeydown="handleUserKey(event)"
        ></textarea>
        <button class="btn-send" onclick="sendUserMessage()">speak</button>
      </div>
    </div>
  </div>

  <!-- Shared sidebar -->
  <div class="sidebar sidebar-shared" style="width:180px; border-right:1px solid var(--border); border-left:1px solid var(--border);">
    <div class="sidebar-header sidebar-shared">
      <div class="dot"></div>
      SHARED
    </div>
    <div class="sidebar-section">both bots read this</div>
    <div class="file-list" id="filesShared"></div>
    <div class="file-add">
      <input id="newFileShared" placeholder="new file…" />
      <button class="btn-tiny" onclick="createFile('shared')">+</button>
    </div>
  </div>

  <!-- Bot B sidebar -->
  <div class="sidebar sidebar-b right" id="sidebarB">
    <div class="sidebar-header">
      <div class="dot"></div>
      <span id="labelB">ABACI</span>
    </div>

    <div class="sidebar-section">memory</div>
    <div class="obsessions" id="obsessionsB">
      <span class="obsession-tag" style="opacity:0.3">—</span>
    </div>

    <div class="sidebar-section">private files</div>
    <div class="file-list" id="filesB"></div>
    <div class="file-add">
      <input id="newFileB" placeholder="new file…" />
      <button class="btn-tiny" onclick="createFile('bot_b')">+</button>
    </div>
  </div>

</main>

<!-- ── File viewer modal ────────────────────────────────────────────────────── -->
<div class="modal-backdrop" id="modal" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-header">
      <span id="modalTitle">file</span>
      <button class="modal-close" onclick="closeModalDirect()">✕</button>
    </div>
    <div class="modal-body">
      <textarea id="modalContent" spellcheck="false"></textarea>
    </div>
    <div class="modal-footer">
      <button class="btn-tiny" onclick="saveModalFile()">save</button>
      <button class="btn-tiny" onclick="closeModalDirect()">close</button>
    </div>
  </div>
</div>

<!-- ── Script ───────────────────────────────────────────────────────────────── -->
<script>
const API = "http://localhost:5000/api";
let autoMode    = false;
let autoTimer   = null;
let autoDelay   = 18000;  // ms between auto turns
let generating  = false;
let modalSpace  = null;
let modalFile   = null;
let botNames    = { a: "MAUK", b: "ABACI", user: "YOU" };

// ── Init ──────────────────────────────────────────────────────────────────────

async function init() {
  await fetchStatus();
  await loadConversation();
  loadAllFiles();
  loadMemory("a");
  loadMemory("b");
  setInterval(fetchStatus, 8000);
  setInterval(() => { loadMemory("a"); loadMemory("b"); }, 15000);
}

async function fetchStatus() {
  try {
    const r = await fetch(`${API}/status`);
    const s = await r.json();

    botNames.a    = s.bots.a.name;
    botNames.b    = s.bots.b.name;
    botNames.user = s.user || "YOU";

    document.getElementById("nameA").textContent  = s.bots.a.name;
    document.getElementById("nameB").textContent  = s.bots.b.name;
    document.getElementById("labelA").textContent = s.bots.a.name;
    document.getElementById("labelB").textContent = s.bots.b.name;
    document.title = `${s.bots.a.name} ∩ ${s.bots.b.name}`;

    setStatus("statusA", s.bots.a.status, s.bots.a.name);
    setStatus("statusB", s.bots.b.status, s.bots.b.name);
    document.getElementById("deviceTag").textContent = s.device || "";
  } catch (e) {
    setStatus("statusA", "error", "A");
    setStatus("statusB", "error", "B");
  }
}

function setStatus(id, status, name) {
  const el = document.getElementById(id);
  el.className = `status-pill ${status}`;
  el.textContent = `${name[0]}: ${status}`;
}

// ── Conversation ──────────────────────────────────────────────────────────────

async function loadConversation() {
  try {
    const r    = await fetch(`${API}/conversation`);
    const msgs = await r.json();
    const conv = document.getElementById("conversation");
    conv.innerHTML = "";
    if (msgs.length === 0) {
      conv.innerHTML = `<div class="empty-state" id="emptyState">
        <div class="glyph">∅</div>
        <p>the empty set is waiting</p>
      </div>`;
      return;
    }
    msgs.forEach(appendMessage);
  } catch (e) {
    console.error("Failed to load conversation:", e);
  }
}

function appendMessage(msg) {
  const conv = document.getElementById("conversation");
  const empty = document.getElementById("emptyState");
  if (empty) empty.remove();

  const isA    = msg.speaker === botNames.a;
  const isB    = msg.speaker === botNames.b;
  const isUser = msg.role === "user";
  const cls    = isUser ? "user" : (isA ? "bot-a" : "bot-b");

  const time = new Date(msg.timestamp + "Z").toLocaleTimeString([], {
    hour: "2-digit", minute: "2-digit"
  });

  const div = document.createElement("div");
  div.className = `msg ${cls}`;
  div.dataset.id = msg.id;
  div.innerHTML = `
    <div class="msg-meta">
      <span class="speaker-name">${msg.speaker}</span>
      <span class="msg-time">${time}</span>
    </div>
    <div class="msg-bubble">${escHtml(msg.text)}</div>
  `;
  conv.appendChild(div);
  conv.scrollTop = conv.scrollHeight;
}

async function clearConversation() {
  if (!confirm("Clear the entire conversation?")) return;
  await fetch(`${API}/conversation`, { method: "DELETE" });
  await loadConversation();
}

// ── Generation ────────────────────────────────────────────────────────────────

async function generate(bot) {
  if (generating) return;
  generating = true;
  const btn = document.getElementById(bot === "a" ? "btnA" : "btnB");
  const orig = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = `generating <span class="spinner"></span>`;

  try {
    const r = await fetch(`${API}/generate/${bot}`, { method: "POST" });
    if (!r.ok) throw new Error(await r.text());
    const msg = await r.json();
    appendMessage(msg);
  } catch (e) {
    console.error("Generation error:", e);
  } finally {
    btn.innerHTML = orig;
    btn.disabled  = false;
    generating    = false;
  }
}

async function sendUserMessage() {
  const ta   = document.getElementById("userInput");
  const text = ta.value.trim();
  if (!text) return;

  try {
    const r = await fetch(`${API}/conversation`, {
      method:  "POST",
      headers: { "Content-Type": "application/json" },
      body:    JSON.stringify({ text, speaker: botNames.user }),
    });
    const msg = await r.json();
    appendMessage(msg);
    ta.value = "";
    ta.style.height = "auto";
  } catch (e) {
    console.error("Send error:", e);
  }
}

function handleUserKey(e) {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendUserMessage();
  }
  // Auto-grow textarea
  setTimeout(() => {
    e.target.style.height = "auto";
    e.target.style.height = Math.min(e.target.scrollHeight, 100) + "px";
  }, 0);
}

// ── Auto mode ─────────────────────────────────────────────────────────────────

function toggleAuto() {
  autoMode = !autoMode;
  const btn = document.getElementById("btnAuto");
  if (autoMode) {
    btn.classList.add("active");
    btn.textContent = "AUTO ●";
    runAutoTurn();
  } else {
    btn.classList.remove("active");
    btn.textContent = "AUTO";
    clearTimeout(autoTimer);
  }
}

let autoBot = "a";

async function runAutoTurn() {
  if (!autoMode) return;
  await generate(autoBot);
  autoBot = autoBot === "a" ? "b" : "a";
  // Jitter: ±20% of delay
  const jitter = (Math.random() - 0.5) * autoDelay * 0.4;
  autoTimer = setTimeout(runAutoTurn, autoDelay + jitter);
}

// ── Memory ────────────────────────────────────────────────────────────────────

async function loadMemory(bot) {
  try {
    const r = await fetch(`${API}/memory/${bot}`);
    const m = await r.json();
    const id = bot === "a" ? "obsessionsA" : "obsessionsB";
    const el = document.getElementById(id);
    if (!m.available || !m.top_obsessions?.length) {
      el.innerHTML = `<span class="obsession-tag" style="opacity:0.3">—</span>`;
      return;
    }
    el.innerHTML = m.top_obsessions
      .map(o => `<span class="obsession-tag">${escHtml(o)}</span>`)
      .join("");
  } catch (e) {}
}

// ── File management ───────────────────────────────────────────────────────────

async function loadFiles(space) {
  const ids = { bot_a: "filesA", bot_b: "filesB", shared: "filesShared" };
  const el  = document.getElementById(ids[space]);
  try {
    const r     = await fetch(`${API}/files/${space}`);
    const files = await r.json();
    el.innerHTML = "";
    if (!files.length) {
      el.innerHTML = `<div style="padding:6px 12px;color:var(--dim);font-size:10px;font-family:var(--font-mono)">empty</div>`;
      return;
    }
    files.forEach(f => {
      const row = document.createElement("div");
      row.className = "file-item";
      row.innerHTML = `
        <span class="file-name" onclick="openFile('${space}','${escAttr(f.name)}')">${escHtml(f.name)}</span>
        <button class="file-del" onclick="deleteFile('${space}','${escAttr(f.name)}')">✕</button>
      `;
      el.appendChild(row);
    });
  } catch (e) {}
}

function loadAllFiles() {
  loadFiles("bot_a");
  loadFiles("bot_b");
  loadFiles("shared");
}

async function createFile(space) {
  const ids = { bot_a: "newFileA", bot_b: "newFileB", shared: "newFileShared" };
  const inp = document.getElementById(ids[space]);
  const name = inp.value.trim();
  if (!name) return;
  await fetch(`${API}/files/${space}`, {
    method:  "POST",
    headers: { "Content-Type": "application/json" },
    body:    JSON.stringify({ name, content: "" }),
  });
  inp.value = "";
  await loadFiles(space);
  openFile(space, name);
}

async function deleteFile(space, name) {
  if (!confirm(`Delete ${name}?`)) return;
  await fetch(`${API}/files/${space}/${encodeURIComponent(name)}`, { method: "DELETE" });
  await loadFiles(space);
}

async function openFile(space, name) {
  const r    = await fetch(`${API}/files/${space}/${encodeURIComponent(name)}`);
  const data = await r.json();
  modalSpace = space;
  modalFile  = name;
  document.getElementById("modalTitle").textContent = `${space} / ${name}`;
  document.getElementById("modalContent").value     = data.content;
  document.getElementById("modal").classList.add("open");
}

async function saveModalFile() {
  const content = document.getElementById("modalContent").value;
  await fetch(`${API}/files/${modalSpace}`, {
    method:  "POST",
    headers: { "Content-Type": "application/json" },
    body:    JSON.stringify({ name: modalFile, content }),
  });
  await loadFiles(modalSpace);
}

function closeModal(e) {
  if (e.target === document.getElementById("modal")) closeModalDirect();
}

function closeModalDirect() {
  document.getElementById("modal").classList.remove("open");
  modalSpace = null;
  modalFile  = null;
}

// ── Utils ──────────────────────────────────────────────────────────────────────

function escHtml(s) {
  return String(s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function escAttr(s) {
  return String(s).replace(/'/g, "\\'");
}

// ── Boot ──────────────────────────────────────────────────────────────────────

init();
</script>
